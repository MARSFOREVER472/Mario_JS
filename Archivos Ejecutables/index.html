<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Bros</title>

    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
</head>
<body>

    <div class="mario-game" id="container">
        <div class="barraProgreso">
            <p><span class="topline-mario">MARIO</span>
               <span class="topline-world">WORLD</span>
               <span class="topline-time">TIME</span>
               <span id="bottomline-score">000000</span>
               <span id="bottomline-coin"><img src="https://raw.githubusercontent.com/LantareCode/random-this-and-thats/master/CSS/SuperMario-Animation/images/Coin.gif" height="40px"> x <span id="actualizarMonedas">00</span>
               <span class="bottomline-world">1 - 1</span>
               <span class="bottomline-time" id="tiempoRestante">000</span>
            </p>
        </div>

        <div id="fondo"></div>
        <div id="estilo" class="capaEstilo"></div>
        <div id="items" class="capas">
            <div class="bloques">
                <img src="https://itc.yananas.com/git/mario/assets/coin.gif" alt="" id="monedas"></div>
            </div>

            <div id="plantas" class="capas-planta"></div>
            <div id="montanas" class="capas-montana"></div>
            <div id="nubes" class="capas-nube"></div>
            <div id="mario" class="lookingRight"></div>
            
        </div>
    </div>
    
</body>
</html>
