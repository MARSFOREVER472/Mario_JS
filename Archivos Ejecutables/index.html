<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Bros</title>

    <link href="style.css" rel="stylesheet">
</head>
<body>

    <div class="mario-game" id="container">
        <div class="scorebar">
            <p><span class="topline-mario">MARIO</span>
               <span class="topline-world">WORLD</span>
               <span class="topline-time">TIME</span>
               <span id="bottomline-score">000000</span>
               <span id="bottomline-coin"><img src="https://raw.githubusercontent.com/LantareCode/random-this-and-thats/master/CSS/SuperMario-Animation/images/Coin.gif" height="40px"> x <span id="updateCoins">00</span>
               <span class="bottomline-world">1 - 1</span>
               <span class="bottomline-time" id="timeLeft">000</span>
            </p>
        </div>

        <div id="background"></div>
        <div id="foreground" class="layer-foreground"></div>
        <div id="items" class="layer">
            <div class="block">
                <img src="https://itc.yananas.com/git/mario/assets/coin.gif" alt="" id="coin"></div>
            </div>

            <div id="plants" class="layer plants"></div>
            <div id="mountains" class="layer mountains"></div>
            <div id="clouds" class="layer clouds"></div>
            <div id="mario" class="lookingRight"></div>
            
        </div>
    </div>

    <script src="marioGame.js"></script>
    
</body>
</html>
